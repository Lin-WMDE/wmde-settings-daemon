[package]
name = "wmde-settings-daemon"
version = "1.11.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]
members = [
    "audio-client",
    "audio-core",
    "audio-server",
    "config",
    "cosmic-settings-daemon-config",
    "geonames",
    "cosmic-pipewire",
    "varlink-server",
]

[workspace.dependencies]
cosmic-config = { git = "https://github.com/pop-os/libcosmic" }
cosmic-theme = { git = "https://github.com/pop-os/libcosmic" }

[workspace.dependencies.zlink]
version = "0.5"
default-features = false
features = ["tokio"]

[dependencies]
anyhow = "1.0.99"
chrono = "0.4.42"
cosmic-comp-config = { git = "https://github.com/pop-os/cosmic-comp" }
cosmic-config.workspace = true
cosmic-dbus-a11y = { git = "https://github.com/pop-os/dbus-settings-bindings" }
cosmic-settings-audio-server = { path = "./audio-server" }
cosmic-settings-daemon-config = { path = "./cosmic-settings-daemon-config", features = [
    "greeter",
] }
cosmic-settings-varlink-server = { path = "./varlink-server" }
cosmic-theme.export = true
cosmic-theme.workspace = true
ddc-hi = "0.4.1"
dirs = "6.0.0"
futures = "0.3.31"
futures-util = "0.3.31"
geonames = { path = "geonames" }
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false }
locale1 = { git = "https://github.com/pop-os/dbus-settings-bindings" }
log = "0.4.28"
memoize = "0.5.1"
notify = "8.2.0"
notify-rust = "4.11.7"
serde = "1.0.228"
sunrise = "2.1.0"
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "signal"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
udev = "0.9.3"
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
walkdir = "2.5.0"
zbus = { version = "5.11.0", default-features = false, features = ["tokio"] }
cctk = { package = "cosmic-client-toolkit", git = "https://github.com/pop-os/cosmic-protocols" }
calloop = "0.14.4"
calloop-wayland-source = "0.4.1"

# Unify every libcosmic crate on the local WMDE fork. Patch BOTH pop-os URL
# forms so transitively-pulled cosmic-config resolves to the same version as ours.
[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "../libcosmic" }
cosmic-config = { path = "../libcosmic/cosmic-config" }
cosmic-config-derive = { path = "../libcosmic/cosmic-config-derive" }
cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[patch."https://github.com/pop-os/cosmic-comp"]
cosmic-comp-config = { path = "../wmde-comp/cosmic-comp-config" }

# WMDE: redirect standard D-Bus binding crates to the local wmde-dbus-settings-bindings
# fork (source-purity; these bind standard freedesktop/system services, identical to pop-os).
[patch."https://github.com/pop-os/dbus-settings-bindings"]
cosmic-dbus-a11y = { path = "../wmde-dbus-settings-bindings/a11y" }
locale1 = { path = "../wmde-dbus-settings-bindings/locale1" }
upower_dbus = { path = "../wmde-dbus-settings-bindings/upower" }

# WMDE: shared release profile, see .doc/perf.
#  - panic = "abort" drops .eh_frame and .gcc_except_table; catch_unwind stops catching,
#    which in this stack only guards SVG parsing in iced's vector backends.
#  - lto = "fat" with one codegen unit removes what monomorphisation duplicated.
# The LTO half is expensive and single threaded; FAST=1 turns it off for development
# builds without touching panic or opt-level, so behaviour still matches what ships.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
