# Один конфиг nFPM на оба формата. Стейджинг готовит `just package-staging`,
# версию всегда подставляет just через env WMDE_VERSION (см. justfile).
# ВАЖНО: только ${WMDE_VERSION} без :-дефолта — nFPM раскрывает env через
# os.ExpandEnv и :- не понимает (версия молча станет 0.0.0~rc0).
name: wmde-settings-daemon
arch: amd64
version: ${WMDE_VERSION}
release: 1
maintainer: WMDE <wmde@wmde.fun>
description: |-
  WMDE settings backend daemon (fork of cosmic-settings-daemon)
  Brightness, audio, theme and keyboard handling plus audio server.
homepage: https://wmde.fun
license: GPL-3.0-or-later
section: x11

# Как в PKGBUILD: pipewire/pulse (аудио), udev/systemd (подсветка/logind),
# xkbcommon (раскладки), dbus, ddcutil (яркость внешних мониторов).
depends:
  - libc6 | glibc
  - libgcc-s1 | libgcc
  - libxkbcommon0
  - libpipewire-0.3-0t64
  - libpulse0t64 | libpulse0
  - libudev1
  - ddcutil

# Мягкие зависимости из PKGBUILD optdepends.
suggests:
  - policykit-1 | polkit
  - geoclue-2.0
  - wmde-osd

contents:
  - src: target/staging/usr/bin/wmde-settings-daemon
    dst: /usr/bin/wmde-settings-daemon
    file_info: { mode: 0755 }
  - src: target/staging/usr/share/wmde/
    dst: /usr/share/wmde/
    type: tree
  - src: target/staging/usr/share/polkit-1/
    dst: /usr/share/polkit-1/
    type: tree
  # doc (copyright + changelog.Debian.gz) готовит just package-doc.
  # Только для deb: в rpm нет %doc-разметки у nFPM,
  # а лицензия и changelog там и так есть (License-тег + %changelog).
  - src: target/staging/usr/share/doc/wmde-settings-daemon/
    dst: /usr/share/doc/wmde-settings-daemon/
    type: tree
    packager: deb

# %changelog для rpm генерит just package-staging (иначе E: no-changelogname-tag).
# Путь от корня репо: nFPM резолвит его от cwd, а не от каталога конфига.
changelog: target/changelog.yaml

overrides:
  deb:
    # ldd бинаря: из системных только udev сверх базы; ssl/dbus/systemd/dbus —
    # только сборке. polkitd вместо policykit-1 (переименован в trixie).
    depends:
      - libc6
      - libgcc-s1
      - libxkbcommon0
      - libpipewire-0.3-0t64
      - libpulse0t64 | libpulse0
      - libudev1
      - libfontconfig1
      - libfreetype6
      - libexpat1
      - ddcutil
    suggests:
      - polkitd
      - geoclue-2.0
      - wmde-osd
  rpm:
    # SONAME вместо имён пакетов: имена расходятся между
    # Fedora и openSUSE, а SONAME предоставляют обе семьи.
    depends:
      - libc.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libpipewire-0.3.so.0()(64bit)
      - libpulse.so.0()(64bit)
      - libudev.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libexpat.so.1()(64bit)
      - ddcutil
    suggests:
      - polkit
      - geoclue2
      - wmde-osd
